# Notify DingTalk when a pull request becomes reviewable.
name: 🔔 Pull Request Notification to DingTalk

on:
  push:
    branches: [test/dingtalk-pr-router-e2e-20260715-1]
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 📬 Send pull request to DingTalk
        uses: actions/github-script@v8
        env:
          DINGTALK_PR_WEBHOOK: ${{ secrets.DINGTALK_PR_WEBHOOK }}
          DINGTALK_PR_SECRET: ${{ secrets.DINGTALK_PR_SECRET }}
          DINGTALK_PR_AT_USER_ID: ${{ vars.DINGTALK_PR_AT_USER_ID }}
        with:
          script: |
            const crypto = require('crypto');
            const webhook = process.env.DINGTALK_PR_WEBHOOK;
            const secret = process.env.DINGTALK_PR_SECRET;
            const atUserId = process.env.DINGTALK_PR_AT_USER_ID;
            const routeMarker = 'DWS_PR_REVIEW_ROUTER_V1';
            if (!webhook || !secret || !atUserId) {
              core.setFailed(
                'DINGTALK_PR_WEBHOOK, DINGTALK_PR_SECRET, and DINGTALK_PR_AT_USER_ID must all be configured',
              );
              return;
            }

            const pull = context.payload.pull_request || {
              number: 5,
              title: 'GitHub PR to Devix router',
              user: { login: context.actor },
              draft: false,
              body: 'Temporary end-to-end test for the DWS PR review router.',
              html_url: 'https://github.com/sczheng189/dingtalk-workspace-cli/pull/5',
            };
            const action = context.payload.action || 'e2e_router_test';
            const author = pull.user?.login || 'unknown';
            const status = pull.draft ? 'Draft' : 'Ready for review';
            const description = (pull.body || 'No description')
              .replace(/<!--([\s\S]*?)-->/g, '')
              .trim()
              .slice(0, 500);
            const title = `[${action.toUpperCase()}] PR #${pull.number}: ${pull.title}`;
            const text = [
              '## 🔔 GitHub Pull Request 通知',
              '',
              `**${title}**`,
              '',
              `👤 **Author**: ${author}`,
              '',
              `📋 **Status**: ${status}`,
              '',
              description || 'No description',
              description.length >= 500 ? '...' : '',
              '',
              `[点击查看 PR](${pull.html_url})`,
              '',
              '---',
              `📦 ${context.repo.owner}/${context.repo.repo}`,
              '',
              '**关键词**: GitHub pull request',
              '',
              `@${atUserId} **路由标识**: ${routeMarker}`,
            ].join('\n');
            const message = {
              msgtype: 'markdown',
              markdown: {
                title: 'GitHub Pull Request 通知',
                text,
              },
              at: {
                atUserIds: [atUserId],
                isAtAll: false,
              },
            };

            const timestamp = String(Date.now());
            const stringToSign = `${timestamp}\n${secret}`;
            const sign = crypto
              .createHmac('sha256', secret)
              .update(stringToSign)
              .digest('base64');
            const signedWebhook = new URL(webhook);
            signedWebhook.searchParams.set('timestamp', timestamp);
            signedWebhook.searchParams.set('sign', sign);

            const response = await fetch(signedWebhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(message),
            });
            const responseText = await response.text();
            if (!response.ok) {
              throw new Error(`DingTalk webhook HTTP ${response.status}: ${responseText}`);
            }
            let result;
            try {
              result = JSON.parse(responseText);
            } catch {
              throw new Error(`DingTalk webhook returned non-JSON: ${responseText}`);
            }
            if (Number(result.errcode || 0) !== 0) {
              throw new Error(
                `DingTalk webhook rejected message: ${result.errcode} ${result.errmsg || ''}`,
              );
            }
            core.info(`DingTalk PR notification sent for #${pull.number}`);
