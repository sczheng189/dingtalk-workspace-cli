# Notify DingTalk when a pull request becomes reviewable.
name: 🔔 Pull Request Notification to DingTalk

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  # Temporary fork-only trigger. Removed after the signed webhook is verified.
  push:
    branches: [feat/github-pr-review-router]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 📬 Send pull request to DingTalk
        uses: actions/github-script@v7
        env:
          DINGTALK_PR_WEBHOOK: ${{ secrets.DINGTALK_PR_WEBHOOK }}
          DINGTALK_PR_SECRET: ${{ secrets.DINGTALK_PR_SECRET }}
        with:
          script: |
            const crypto = require('crypto');
            const webhook = process.env.DINGTALK_PR_WEBHOOK;
            const secret = process.env.DINGTALK_PR_SECRET;
            if (!webhook || !secret) {
              core.setFailed(
                'DINGTALK_PR_WEBHOOK and DINGTALK_PR_SECRET must both be configured',
              );
              return;
            }

            const pull = context.payload.pull_request;
            const isForkSigningTest = context.eventName === 'push';
            const action = isForkSigningTest ? 'signed-webhook-test' : context.payload.action;
            const author = isForkSigningTest
              ? context.actor
              : pull.user?.login || 'unknown';
            const status = isForkSigningTest
              ? 'Fork signing test'
              : pull.draft
                ? 'Draft'
                : 'Ready for review';
            const description = isForkSigningTest
              ? '验证 GitHub Actions 可以使用加签方式调用钉钉自定义机器人。'
              : (pull.body || 'No description')
                  .replace(/<!--([\s\S]*?)-->/g, '')
                  .trim()
                  .slice(0, 500);
            const targetUrl = isForkSigningTest
              ? `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`
              : pull.html_url;
            const title = isForkSigningTest
              ? `[SIGNED WEBHOOK TEST] ${context.sha.slice(0, 7)}`
              : `[${action.toUpperCase()}] PR #${pull.number}: ${pull.title}`;
            const text = [
              '## 🔔 GitHub Pull Request 通知',
              '',
              `**${title}**`,
              '',
              `👤 **Author**: ${author}`,
              '',
              `📋 **Status**: ${status}`,
              '',
              description || 'No description',
              description.length >= 500 ? '...' : '',
              '',
              `[点击查看](${targetUrl})`,
              '',
              '---',
              `📦 ${context.repo.owner}/${context.repo.repo}`,
              '',
              '**关键词**: GitHub pull request',
            ].join('\n');
            const message = {
              msgtype: 'markdown',
              markdown: {
                title: 'GitHub Pull Request 通知',
                text,
              },
            };

            const timestamp = String(Date.now());
            const stringToSign = `${timestamp}\n${secret}`;
            const sign = crypto
              .createHmac('sha256', secret)
              .update(stringToSign)
              .digest('base64');
            const signedWebhook = new URL(webhook);
            signedWebhook.searchParams.set('timestamp', timestamp);
            signedWebhook.searchParams.set('sign', sign);

            const response = await fetch(signedWebhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(message),
            });
            const responseText = await response.text();
            if (!response.ok) {
              throw new Error(`DingTalk webhook HTTP ${response.status}: ${responseText}`);
            }
            let result;
            try {
              result = JSON.parse(responseText);
            } catch {
              throw new Error(`DingTalk webhook returned non-JSON: ${responseText}`);
            }
            if (Number(result.errcode || 0) !== 0) {
              throw new Error(
                `DingTalk webhook rejected message: ${result.errcode} ${result.errmsg || ''}`,
              );
            }
            core.info(
              isForkSigningTest
                ? `DingTalk signed webhook test sent for ${context.sha}`
                : `DingTalk PR notification sent for #${pull.number}`,
            );
